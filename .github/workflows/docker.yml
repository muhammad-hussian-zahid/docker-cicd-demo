name: Docker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE_NAME: docker-cicd-demo

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: |
        npm start &
        APP_PID=$!
        sleep 5
        npm test
        kill $APP_PID || true

    # ✅ FIX: kill any process using port 3000
    - name: Free ports (IMPORTANT FIX)
      run: |
        sudo lsof -ti:3000 | xargs -r sudo kill -9 || true
        sudo lsof -ti:8080 | xargs -r sudo kill -9 || true
        docker rm -f $(docker ps -aq) || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.DOCKER_IMAGE_NAME }}:test
        load: true

    # ✅ FIX: use different port (3001 instead of 3000)
    - name: Test Docker image
      run: |
        docker run -d -p 3001:3000 --name test-container ${{ env.DOCKER_IMAGE_NAME }}:test
        sleep 10
        curl -f http://localhost:3001/health || exit 1
        docker stop test-container || true
        docker rm test-container || true

    # ❌ REMOVE version warning issue
    - name: Prepare docker compose
      run: |
        sed -i '/version:/d' docker-compose.yml

    # ✅ FIX: clean before compose
    - name: Start services
      run: |
        docker compose down -v || true
        docker compose up -d
        sleep 20

    - name: Test services
      run: |
        curl -f http://localhost:3000/health || exit 1
        curl -f http://localhost:8080/health || exit 1

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v || true
        docker system prune -f || true

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
