name: Docker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE_NAME: docker-cicd-demo

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: |
        npm start &
        APP_PID=$!
        sleep 5
        npm test
        kill $APP_PID

    # 🔥 FIX: full cleanup before docker
    - name: Cleanup Docker system
      run: |
        docker compose down -v || true
        docker ps -aq | xargs -r docker rm -f || true
        docker network prune -f || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build image locally
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.DOCKER_IMAGE_NAME }}:test
        load: true

    # Run container WITHOUT host port (FIX)
    - name: Test Docker image
      run: |
        docker run -d --name test-container ${{ env.DOCKER_IMAGE_NAME }}:test
        sleep 10
        docker exec test-container curl -f http://localhost:3000/health || exit 1
        docker stop test-container
        docker rm test-container

    # Replace build with image
    - name: Prepare docker compose
      run: |
        sed -i 's/build: \./image: ${{ env.DOCKER_IMAGE_NAME }}:test/' docker-compose.yml

    # Start compose (NO PORT CONFLICT)
    - name: Start services with Docker Compose
      run: |
        docker compose up -d
        sleep 15

    # Test using internal network (FIX)
    - name: Test services
      run: |
        docker exec docker-cicd-demo-app-1 curl -f http://localhost:3000/health || exit 1
        docker exec docker-cicd-demo-nginx-1 curl -f http://localhost/health || exit 1

    - name: Show logs
      if: always()
      run: |
        docker compose logs app
        docker compose logs nginx

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
        docker system prune -f

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
