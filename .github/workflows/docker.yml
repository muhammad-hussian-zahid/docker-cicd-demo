name: Docker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE_NAME: docker-cicd-demo
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: |
        npm start &
        APP_PID=$!
        sleep 5
        npm test
        kill $APP_PID

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ✅ FIX 1: added load: true
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.DOCKER_IMAGE_NAME }}:test
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # ✅ FIX 2: changed port 3000 → 3001
    - name: Test Docker image
      run: |
        docker run -d -p 3001:3000 --name test-container ${{ env.DOCKER_IMAGE_NAME }}:test
        sleep 10
        curl -f http://localhost:3001/health || exit 1
        docker stop test-container
        docker rm test-container

    # Optional safety cleanup (prevents port conflicts)
    - name: Cleanup old containers
      run: |
        docker ps -aq | xargs -r docker rm -f || true

    # Docker Compose testing steps
    - name: Create test environment with Docker Compose
      run: |
        sed -i 's/build: \./image: ${{ env.DOCKER_IMAGE_NAME }}:test/' docker-compose.yml

    - name: Start services with Docker Compose
      run: |
        docker-compose up -d
        sleep 15

    # ⚠️ FIX 3: avoid port conflict (optional but safer)
    - name: Test Docker Compose services
      run: |
        curl -f http://localhost:3000/health || exit 1
        echo "✅ Direct app access successful"

        curl -f http://localhost:8080/health || exit 1
        echo "✅ Nginx proxy access successful"

        response=$(curl -s http://localhost:3000/)

        if echo "$response" | grep -q "Hello from Docker CI/CD Demo"; then
          echo "✅ App functionality test passed"
        else
          echo "❌ App functionality test failed"
          exit 1
        fi

    - name: Check service logs
      if: always()
      run: |
        docker-compose logs app
        docker-compose logs nginx

    - name: Cleanup Docker Compose
      if: always()
      run: |
        docker-compose down -v
        docker system prune -f

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # FIX 4: safer port usage for verification
    - name: Verify pushed image
      run: |
        docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

        docker run -d -p 3002:3000 --name verify-container ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        sleep 10

        curl -f http://localhost:3002/health || exit 1
        echo "✅ Pushed image verification successful"

        docker stop verify-container
        docker rm verify-container
